<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGest - Comercialização e Gestão Automóvel</title>
    <style>
        :root {
            --primary: #1e293b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--accent);
        }

        nav button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        nav button:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .section-title {
            margin-bottom: 1.5rem;
            font-size: 1.75rem;
            position: relative;
            padding-bottom: 0.5rem;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 3px;
            background-color: var(--accent);
            border-radius: 2px;
        }

        /* FILTROS E STOCK */
        .search-container {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 1px 3px rgb(0 0 0 / 0.1);
            margin-bottom: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            align-items: flex-end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-light);
        }

        .filter-group select, .filter-group input {
            padding: 0.6rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
            background-color: var(--background);
        }

        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .car-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .car-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        .car-img {
            width: 100%;
            height: 200px;
            background-color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            font-weight: 500;
            position: relative;
        }

        .car-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(15, 23, 42, 0.85);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .car-info {
            padding: 1.5rem;
        }

        .car-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .car-specs {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 1rem;
        }

        .car-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .btn-action {
            display: block;
            width: 100%;
            background-color: var(--accent);
            color: white;
            text-align: center;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
        }

        .btn-action:hover {
            background-color: var(--accent-hover);
        }

        /* BACK-OFFICE / GESTOR DE ENCOMENDAS */
        .admin-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            border: 1px solid var(--border);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-top: 1rem;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: var(--background);
            color: var(--text-light);
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-pill {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-reserva { background-color: #fef3c7; color: #d97706; }
        .status-credito { background-color: #dbeafe; color: #2563eb; }
        .status-oficina { background-color: #e0f2fe; color: #0369a1; }
        .status-pronto { background-color: #d1fae5; color: #059669; }

        .select-status {
            padding: 0.4rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            outline: none;
            font-size: 0.9rem;
        }

        .hidden {
            display: none;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-light);
            font-size: 0.9rem;
            margin-top: 4rem;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <h1>Auto<span>Gest</span></h1>
        </div>
        <nav>
            <button id="toggle-view-btn" onclick="toggleView()">Ir para Back-office</button>
        </nav>
    </header>

    <main>
        <!-- VISTA DE CLIENTE: PLATAFORMA DE VENDAS -->
        <div id="client-view">
            <h2 class="section-title">O nosso Stock Disponível</h2>
            
            <div class="search-container">
                <div class="filter-group">
                    <label for="filter-brand">Marca</label>
                    <select id="filter-brand">
                        <option value="all">Todas as marcas</option>
                        <option value="bmw">BMW</option>
                        <option value="mercedes">Mercedes-Benz</option>
                        <option value="audi">Audi</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-fuel">Combustível</label>
                    <select id="filter-fuel">
                        <option value="all">Todos</option>
                        <option value="eletrico">Elétrico</option>
                        <option value="hibrido">Híbrido</option>
                        <option value="diesel">Diesel</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="search-price">Preço Máximo</label>
                    <input type="number" id="search-price" placeholder="Ex: 40000">
                </div>
                <button class="btn-action" style="height: 42px; padding: 0 1.5rem;">Filtrar</button>
            </div>

            <div class="car-grid">
                <!-- Carro 1 -->
                <div class="car-card">
                    <div class="car-img">
                        [ Imagem: BMW Série 3 ]
                        <span class="car-badge">Novo</span>
                    </div>
                    <div class="car-info">
                        <div class="car-title">BMW 320d Pack M</div>
                        <div class="car-specs">
                            <span>2023</span> • <span>45,000 km</span> • <span>Diesel</span>
                        </div>
                        <div class="car-price">38.900 €</div>
